<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A private, offline-first drawing canvas.">
  <meta name="format-detection" content="telephone=no">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FDF7F8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Slate">
  <!-- Journal can send title-only activity to GitHub after explicit opt-in.
       Canvas elements, text, images, fonts, and analytics never leave Slate. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.github.com; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/app.css">
  <title>Slate — Draw</title>
</head>
<body>
  <div id="app"></div>
  <div id="toasts" aria-live="polite" aria-atomic="true"></div>
  <noscript>
    <p style="padding:24px;font-family:Verdana,sans-serif">slate needs JavaScript to draw.</p>
  </noscript>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
